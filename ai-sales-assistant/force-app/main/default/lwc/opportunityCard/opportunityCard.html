<template>
    <div
        class="slds-box slds-box_x-small slds-m-bottom_x-small opp-card"
        onclick={handleSelect}
        onkeydown={handleKeyDown}
        role="button"
        tabindex="0"
    >
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <div>
                <p class="slds-text-heading_small">{opportunity.name}</p>
                <p class="slds-text-body_small slds-text-color_weak">{opportunity.accountName}</p>
            </div>
            <span class={riskBadgeClass}>{riskLabel}</span>
        </div>
        <div class="slds-grid slds-grid_align-spread slds-m-top_x-small slds-text-body_small">
            <lightning-formatted-number
                value={opportunity.amount}
                format-style="currency"
                currency-code="USD"
            ></lightning-formatted-number>
            <span>{opportunity.stageName}</span>
        </div>
    </div>
</template>
